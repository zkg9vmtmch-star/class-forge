<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class Forge v4 - D&D Engine</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #0b1020, #05060a);
    color: #e6e6e6;
}

/* NAV */
.nav {
    display: flex;
    gap: 6px;
    padding: 10px;
    background: rgba(20, 25, 40, 0.8);
    backdrop-filter: blur(10px);
}

.nav button {
    flex: 1;
    padding: 12px;
    border: 1px solid #2a3a55;
    background: #111827;
    color: white;
    border-radius: 10px;
    cursor: pointer;
}

.nav button.active {
    background: #38bdf8;
    color: black;
    box-shadow: 0 0 12px #38bdf8;
}

/* PAGES */
.page {
    display: none;
    padding: 20px;
}

.page.active {
    display: block;
}

/* INPUTS */
textarea, input, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #2a3a55;
    background: #0f172a;
    color: white;
}

/* BUTTONS */
button.action {
    margin-top: 10px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #22c55e, #38bdf8);
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

/* CARD */
.card {
    margin-top: 15px;
    background: rgba(17, 24, 39, 0.9);
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #2a3a55;
    white-space: pre-wrap;
}

.small {
    font-size: 12px;
    opacity: 0.7;
}
</style>

</head>

<body>

<!-- NAV -->
<div class="nav">
    <button class="active" onclick="switchPage('home')">Home</button>
    <button onclick="switchPage('forge')">Forge</button>
    <button onclick="switchPage('features')">Features</button>
    <button onclick="switchPage('library')">Library</button>
    <button onclick="switchPage('export')">Export</button>
</div>

<!-- HOME -->
<div id="home" class="page active">
    <h1>⚔️ Class Forge v4</h1>
    <p>D&D Homebrew Engine (Free)</p>
    <p class="small">No accounts. No servers. Everything runs in browser.</p>
</div>

<!-- FORGE -->
<div id="forge" class="page">

<h2>🧠 Class Builder</h2>

<textarea id="idea" rows="4" placeholder="Describe your class idea..."></textarea>

<select id="role">
    <option>Striker</option>
    <option>Tank</option>
    <option>Controller</option>
    <option>Support</option>
    <option>Mobility Fighter</option>
    <option>Assassin</option>
    <option>Bruiser</option>
    <option>Summoner</option>
    <option>Artillery</option>
    <option>Grappler</option>
    <option>Hybrid</option>
    <option>Wildcard</option>
    <option>Other</option>
</select>

<input id="customRole" placeholder="Custom role (if Other)" />

<button class="action" onclick="forgeClass()">FORGE CLASS</button>

<div id="output" class="card" style="display:none;"></div>

<button class="action" onclick="saveClass()">SAVE</button>
<button class="action" onclick="exportJSON()">EXPORT JSON</button>
<button class="action" onclick="copyShare()">SHARE CODE</button>

</div>

<!-- FEATURES -->
<div id="features" class="page">

<h2>🧩 Feature Builder</h2>

<input id="featureName" placeholder="Feature name" />
<input id="featureCost" placeholder="Cost (1-50)" />

<button class="action" onclick="addFeature()">ADD FEATURE</button>

<div id="featureList" class="card"></div>

</div>

<!-- LIBRARY -->
<div id="library" class="page">
<h2>📦 Library</h2>
<div id="savedList"></div>
</div>

<!-- EXPORT -->
<div id="export" class="page">
<h2>📜 D&D Export</h2>
<div id="exportBox" class="card"></div>
</div>

<script>

let currentClass = null;
let features = [];

// NAV
function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));

    document.getElementById(page).classList.add('active');
    event.target.classList.add('active');

    if (page === "library") loadLibrary();
    if (page === "export") showExport();
}

// STAT ENGINE
function getStats(role) {
    const roles = {
        Striker:[70,50,30,20,20],
        Tank:[30,40,20,80,20],
        Controller:[20,40,70,60,30],
        Support:[20,30,40,50,80],
        "Mobility Fighter":[50,80,40,20,30],
        Assassin:[80,60,20,20,10],
        Bruiser:[60,50,40,50,20],
        Summoner:[40,50,60,30,60],
        Artillery:[90,20,40,20,30],
        Grappler:[50,70,60,40,20],
        Hybrid:[50,50,50,50,50],
        Wildcard:[70,70,70,70,70]
    };

    return roles[role] || [50,50,50,50,50];
}

// BALANCE ENGINE
function balance(stats) {
    let total = stats.reduce((a,b)=>a+b,0);
    let [p,d,m,c,u] = stats;

    let warnings = [];

    if(total > 120) warnings.push("⚠️ OVER BUDGET");
    if(total < 80) warnings.push("🟡 UNDERPOWERED");
    if(m>80 && p>80) warnings.push("🚨 BROKEN: Mobility + Power");

    if(warnings.length===0) warnings.push("🟢 BALANCED");

    return {total, warnings};
}

// FORGE
function forgeClass() {

    let idea = document.getElementById("idea").value;
    let role = document.getElementById("role").value;
    let custom = document.getElementById("customRole").value;

    if(role==="Other" && custom.trim()) role = custom;

    let stats = getStats(role);
    let result = balance(stats);

    currentClass = {
        id:Date.now(),
        idea,
        role,
        stats,
        features,
        total:result.total
    };

    document.getElementById("output").style.display="block";

    document.getElementById("output").innerText=`
⚔️ CLASS FORGED

Concept:
${idea}

Role:
${role}

STATS:
Power:${stats[0]}
Defense:${stats[1]}
Mobility:${stats[2]}
Control:${stats[3]}
Utility:${stats[4]}

FEATURES:
${features.map(f=>"- "+f.name+" (Cost:"+f.cost+")").join("\n")}

TOTAL SCORE:${result.total}/120
${result.warnings.join("\n")}
`;
}

// FEATURES
function addFeature(){
    let name=document.getElementById("featureName").value;
    let cost=parseInt(document.getElementById("featureCost").value)||10;

    features.push({name,cost});
    document.getElementById("featureList").innerText =
    features.map(f=>f.name+" ("+f.cost+")").join("\n");
}

// SAVE
function saveClass(){
    if(!currentClass) return;
    let data=JSON.parse(localStorage.getItem("classes")||"[]");
    data.push(currentClass);
    localStorage.setItem("classes",JSON.stringify(data));
    alert("Saved");
}

// LOAD
function loadLibrary(){
    let data=JSON.parse(localStorage.getItem("classes")||"[]");
    document.getElementById("savedList").innerHTML =
    data.map(c=>`
<div class="card">
⚔️ ${c.role}

${c.idea}

Score:${c.total}
</div>`).join("");
}

// EXPORT JSON
function exportJSON(){
    if(!currentClass) return;
    let blob=new Blob([JSON.stringify(currentClass)],{type:"application/json"});
    let url=URL.createObjectURL(blob);
    let a=document.createElement("a");
    a.href=url;
    a.download="class.json";
    a.click();
}

// SHARE
function copyShare(){
    if(!currentClass) return;
    let code=btoa(JSON.stringify(currentClass));
    navigator.clipboard.writeText(code);
    alert("Copied Share Code");
}

// EXPORT VIEW
function showExport(){
    if(!currentClass) return;
    document.getElementById("exportBox").innerText=
    JSON.stringify(currentClass,null,2);
}

</script>

</body>
</html>
